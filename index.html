<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins Webhook Demo</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #d33833 0%, #ff6b6b 100%);
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .card {
            background: var(--card-bg);
            padding: 3rem 4rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.04);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border-top: 5px solid #d33833; /* Jenkins red accent */
            position: relative;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 1rem 0;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        .badge {
            display: inline-block;
            background: var(--primary-gradient);
            color: white;
            padding: 0.35rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 1.5rem;
            box-shadow: 0 4px 12px rgba(211, 56, 51, 0.3);
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #48bb78;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 0 3px rgba(72, 187, 120, 0.2);
        }

        .status-container {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello from Jenkins</h1>
        <p>Your automated deployment pipeline is running smoothly.</p>
        
        <div class="badge">Version 2</div>

        <div class="status-container">
            <span class="status-dot"></span> Webhook Connected Successfully
        </div>
    </div>

</body>
</html>
